   <fieldset><legend>Signes de déshydratation sévère</legend>
   ${["Léthargique ou inconscient","Yeux enfoncés","Boit difficilement ou incapable de boire","Pli cutané s'efface très lentement (> 2 s)"].map((e,t)=>`<label class="chk"><input type="checkbox" data-g="s" data-i="${t}"> ${e}</label>`).join("")}</fieldset>

   <div class="field-row"><label>Poids (kg)<input type="number" step="0.1" id="dh-poids" placeholder="ex. 10"></label></div>`,calc:e=>{const t=e.querySelectorAll("[data-g=s]:checked").length,s=e.querySelectorAll("[data-g=m]:checked").length,a=num(e.querySelector("#dh-poids").value);return t>=2?{v:"Déshydratation sévère",cls:"bad",d:"Plan C : Ringer lactate 100 ml/kg"+(a?` = <b>${Math.round(100*a)} ml</b> (30 ml/kg = ${Math.round(30*a)} ml puis 70 ml/kg = ${Math.round(70*a)} ml ; < 12 mois : 1 h + 5 h ; ≥ 12 mois : 30 min + 2 h 30)`:"")+". Réévaluer toutes les 1–2 h."}:s>=2||t+s>=2?{v:"Déshydratation modérée (signes évidents)",cls:"warn",d:"Plan B : SRO 75 ml/kg en 4 h"+(a?` = <b>${Math.round(75*a)} ml</b>`:"")+" sous surveillance, puis réévaluer. Zinc."}:{v:"Pas de déshydratation",cls:"ok",d:"Plan A : SRO à domicile après chaque selle, poursuivre l'alimentation et l'allaitement, zinc 10–14 jours, signes de retour."}}},imc:{expl:"IMC = poids (kg) / taille² (m). Chez l'enfant, l'IMC s'interprète sur les courbes IMC/âge de l'OMS (Z-scores) selon le sexe ; il n'existe pas de seuil fixe comme chez l'adulte.",html:()=>'<div class="field-row"><label>Poids (kg)<input type="number" step="0.1" id="c-p"></label><label>Taille (cm)<input type="number" step="0.1" id="c-t"></label></div>',calc:e=>{const t=num(e.querySelector("#c-p").value),s=num(e.querySelector("#c-t").value);return!t||!s?null:{v:(t/Math.pow(s/100,2)).toFixed(1)+" kg/m²",cls:"info",d:"Reporter la valeur sur la courbe IMC/âge OMS : < −2 Z = maigreur ; > +1 Z = risque de surpoids ; > +2 Z = surpoids (5–19 ans : obésité)."}}},surface:{expl:"Surface corporelle (m²) = √(taille (cm) × poids (kg) / 3600). Utilisée pour certains médicaments (corticoïdes du syndrome néphrotique, chimiothérapie) et l'interprétation de la diurèse.",html:()=>'<div class="field-row"><label>Poids (kg)<input type="number" step="0.1" id="c-p"></label><label>Taille (cm)<input type="number" step="0.1" id="c-t"></label></div>',calc:e=>{const t=num(e.querySelector("#c-p").value),s=num(e.querySelector("#c-t").value);if(!t||!s)return null;const a=Math.sqrt(s*t/3600);return{v:a.toFixed(2)+" m²",cls:"info",d:`Exemple : prednisone 60 mg/m²/j = ${Math.min(60,Math.round(60*a))} mg/j (maximum 60 mg).`}}},holliday:{expl:"Besoins d'entretien : 100 ml/kg pour les 10 premiers kg, + 50 ml/kg de 10 à 20 kg, + 20 ml/kg au-delà de 20 kg (par 24 h). Ne s'applique pas au nouveau-né ni à la réhydratation des pertes.",html:()=>'<div class="field-row"><label>Poids (kg)<input type="number" step="0.1" id="c-p"></label></div>',calc:e=>{const t=num(e.querySelector("#c-p").value);if(!t)return null;let s=t<=10?100*t:t<=20?1e3+50*(t-10):1500+20*(t-20);return{v:Math.round(s)+" ml/24 h",cls:"info",d:`Soit ≈ ${(s/24).toFixed(0)} ml/h (règle 4-2-1). Adapter en cas de fièvre, déshydratation, insuffisance cardiaque ou rénale, SIADH (méningite).`}}},schwartz:{expl:"Formule de Schwartz révisée (2009) : DFG (ml/min/1,73 m²) = 36,5 × taille (cm) / créatininémie (µmol/l). Valable chez l'enfant de 1 à 18 ans avec dosage enzymatique de la créatinine.",html:()=>'<div class="field-row"><label>Taille (cm)<input type="number" step="0.1" id="c-t"></label><label>Créatinine (µmol/l)<input type="number" step="0.1" id="c-c"></label></div>',calc:e=>{const t=num(e.querySelector("#c-t").value),s=num(e.querySelector("#c-c").value);if(!t||!s)return null;const a=36.5*t/s;return{v:a.toFixed(0)+" ml/min/1,73 m²",cls:a>=90?"ok":a>=60?"warn":"bad",d:a>=90?"DFG normal (≥ 90)":a>=60?"Diminution légère (60–89)":a>=30?"Insuffisance rénale modérée (30–59)":a>=15?"Insuffisance rénale sévère (15–29)":"Insuffisance rénale terminale (< 15)"}}},"poids-age":{expl:"Estimation du poids en urgence lorsque la pesée est impossible (formules APLS). Toujours peser l'enfant dès que possible.",html:()=>'<div class="field-row"><label>Âge<input type="number" step="1" id="c-a"></label><label>Unité<select id="c-u"><option value="m">mois</option><option value="a" selected>ans</option></select></label></div>',calc:e=>{const t=num(e.querySelector("#c-a").value),s=e.querySelector("#c-u").value;if(t===null)return null;let a,n;if(s==="m"&&t<=12)a=.5*t+4,n="(0,5 × âge en mois) + 4";else{const i=s==="m"?t/12:t;i<=5?(a=2*i+8,n="(2 × âge) + 8"):(a=3*i+7,n="(3 × âge) + 7")}return{v:a.toFixed(1)+" kg",cls:"info",d:"Formule utilisée : "+n}}},"taille-cible":{expl:"Taille adulte attendue à partir de la taille des parents (formule de Tanner), ± 8,5 cm. Une taille projetée très inférieure à la taille cible doit faire rechercher une cause pathologique.",html:()=>'<div class="field-row"><label>Taille du père (cm)<input type="number" id="c-tp"></label><label>Taille de la mère (cm)<input type="number" id="c-tm"></label><label>Sexe<select id="c-s"><option value="g">Garçon</option><option value="f">Fille</option></select></label></div>',calc:e=>{const t=num(e.querySelector("#c-tp").value),s=num(e.querySelector("#c-tm").value),a=e.querySelector("#c-s").value;if(!t||!s)return null;const n=(t+s+(a==="g"?13:-13))/2;return{v:n.toFixed(1)+" cm",cls:"info",d:`Intervalle attendu : ${(n-8.5).toFixed(0)} à ${(n+8.5).toFixed(0)} cm.`}}},pb:{expl:"Mesure du périmètre brachial à mi-distance acromion–olécrane du bras gauche, chez l'enfant de 6 à 59 mois. Toujours rechercher les œdèmes bilatéraux.",html:()=>'<div class="field-row"><label>PB (mm)<input type="number" id="c-pb" placeholder="ex. 118"></label><label>Œdèmes bilatéraux<select id="c-oe"><option value="0">Absents</option><option value="1">+ (pieds)</option><option value="2">++ (pieds + jambes)</option><option value="3">+++ (généralisés)</option></select></label></div>',calc:e=>{const t=num(e.querySelector("#c-pb").value),s=+e.querySelector("#c-oe").value;return!t&&!s?null:s>0||t<115?{v:"Malnutrition aiguë sévère",cls:"bad",d:(s===3?"Œdèmes +++ : prise en charge hospitalière (CRENI). ":"")+"Test de l'appétit et recherche de complications pour orienter vers CRENAS ou CRENI."}:t<125?{v:"Malnutrition aiguë modérée",cls:"warn",d:"Orientation vers un programme de supplémentation (CRENAM), conseils nutritionnels."}:{v:"Pas de malnutrition aiguë selon le PB",cls:"ok",d:"Compléter par le rapport P/T et la courbe de croissance."}}},"age-corrige":{expl:"Âge corrigé = âge chronologique − (40 − âge gestationnel en semaines). À utiliser pour la croissance et le développement jusqu'à 2 ans (pas pour les vaccins, qui suivent l'âge chronologique).",html:()=>'<div class="field-row"><label>Date de naissance<input type="date" id="c-d"></label><label>Terme à la naissance (SA)<input type="number" id="c-sa" placeholder="ex. 32"></label></div>',calc:e=>{const t=e.querySelector("#c-d").value,s=num(e.querySelector("#c-sa").value);if(!t||!s)return null;const a=(Date.now()-new Date(t))/864e5,n=a-(40-s)*7,i=o=>o<0?"pas encore à terme":Math.floor(o/30.44)+" mois "+Math.round(o%30.44)+" j";return{v:"Âge corrigé : "+i(n),cls:"info",d:"Âge chronologique : "+i(a)}}},debit:{expl:"Débit (gouttes/min) = volume (ml) × facteur de goutte / durée (min). Perfuseur standard : 20 gouttes/ml ; microperfuseur (pédiatrique) : 60 microgouttes/ml (dans ce cas gouttes/min = ml/h).",html:()=>'<div class="field-row"><label>Volume (ml)<input type="number" id="c-v"></label><label>Durée (h)<input type="number" step="0.25" id="c-h"></label><label>Perfuseur<select id="c-f"><option value="20">20 gouttes/ml</option><option value="60">60 microgouttes/ml</option></select></label></div>',calc:e=>{const t=num(e.querySelector("#c-v").value),s=num(e.querySelector("#c-h").value),a=+e.querySelector("#c-f").value;return!t||!s?null:{v:Math.round(t*a/(s*60))+" gouttes/min",cls:"info",d:`Débit horaire : ${(t/s).toFixed(1)} ml/h.`}}},constantes:{expl:"Valeurs de référence approximatives au repos (enfant éveillé et calme). La tendance et le contexte clinique priment sur une valeur isolée.",html:()=>`<table class="tbl"><thead><tr><th>Âge</th><th>FR (/min)</th><th>FC (/min)</th><th>PAS (mmHg)</th><th>Poids moyen</th></tr></thead><tbody>

ace et cou (cuir chevelu, fontanelle, dysmorphie, yeux, goitre)",ty:TA,rows:2},{k:"orl",l:"3.3.10 Stomatologique et ORL (joues, dents, langue, pharynx, amygdales, palais, oreilles, tympans)",ty:TA,rows:2}]},{id:"s4",t:"4. Résumé syndromique",note:"Autant que possible sous forme SYNDROMIQUE, sinon SYMPTOMATIQUE (lister alors tous les symptômes).",f:[{k:"resume",l:"Résumé",ty:TA,rows:5,gen:1}]},{id:"s5",t:"5. Hypothèses diagnostiques",note:"Les hypothèses découlent des syndromes.",f:[{k:"h1",l:"Hypothèse n°1",ty:T},{k:"h2",l:"Hypothèse n°2",ty:T},{k:"h3",l:"Hypothèse n°3",ty:T}]},{id:"s6",t:"6. Discussion",note:"Pour chaque hypothèse : arguments épidémiologiques, anamnestiques, cliniques et paracliniques (citer et interpréter). Les examens complémentaires ne servent qu'à étayer ou écarter un diagnostic : il n'y a donc pas de section « examens complémentaires ».",f:[{h:"6.1 Hypothèse n°1"},{k:"d1p",l:"Arguments en faveur",ty:TA,rows:3},{k:"d1c",l:"Arguments en défaveur",ty:TA,rows:2},{h:"6.2 Hypothèse n°2"},{k:"d2p",l:"Arguments en faveur",ty:TA,rows:2},{k:"d2c",l:"Arguments en défaveur",ty:TA,rows:2},{h:"6.3 Hypothèse n°3"},{k:"d3p",l:"Arguments en faveur",ty:TA,rows:2},{k:"d3c",l:"Arguments en défaveur",ty:TA,rows:2}]},{id:"s7",t:"7. Diagnostic(s) retenu(s)",f:[{k:"diag",l:"Diagnostic retenu",ty:TA,rows:2}]},{id:"s8",t:"8. Diagnostic de retentissement (selon le cas)",f:[{k:"retentissement",l:"Retentissement glycémique, hydro-électrolytique, cardiovasculaire, respiratoire, rénal… (arguments cliniques et paracliniques)",ty:TA,rows:3}]},{id:"s9",t:"9. Diagnostic étiologique (selon le cas)",f:[{k:"causes",l:"9.1 Causes ou facteurs étiologiques et méthodes de diagnostic",ty:TA,rows:2},{k:"porte",l:"9.2 Porte d'entrée / mode de transmission (maladie infectieuse)",ty:T},{k:"terrain",l:"9.3 Diagnostic de terrain (malnutrition, VIH, diabète, hépatite…) avec arguments",ty:TA,rows:2}]},{id:"s10",t:"10. Traitement",f:[{k:"but",l:"But",ty:TA,rows:2},{k:"moyens",l:"Moyens (médicaux symptomatiques, étiologiques, chirurgicaux, instrumentaux)",ty:TA,rows:3},{k:"indications",l:"Indications : PEC des formes cliniques",ty:TA,rows:3},{k:"pec_compl",l:"Prise en charge des complications",ty:TA,rows:2},{k:"pec_cause",l:"Prise en charge de la cause",ty:TA,rows:2}]},{id:"s11",t:"11. Évolution / pronostic",f:[{k:"surveillance",l:"Éléments de surveillance",ty:TA,rows:2},{k:"evolution",l:"Modalités évolutives sous traitement",ty:TA,rows:2},{k:"pronostic",l:"Pronostic",ty:T}]},{id:"s12",t:"Conclusion / intérêt",f:[{k:"conclusion",l:"L'étude de ce cas nous donne l'opportunité de souligner…",ty:TA,rows:3,ph:"importance des vaccinations, rareté de l'observation, diagnostic précoce, PEC urgente, mesures de prévention…"}]}],EXEMPLE_OBS={etudiant:"Étudiant(e) en 7e année (exemple)",niveau:"7e année de médecine",superviseur:"Service de pédiatrie",service:"Urgences pédiatriques",date_obs:"2026-09-14",accueil:"Oui",nom:"A. M. (initiales — cas fictif)",sexe:"Féminin",ddn:"2023-08-02",age:"3 ans 1 mois",lieu_naiss:"Niamey",residence:"Quartier Talladjé, Niamey",pere:"M. A., 38 ans, commerçant",mere:"H. S., 27 ans, ménagère",matrimonial:"Mariée (polygamie)",date_adm:"2026-09-14",adresse_par:"Centre de santé intégré du quartier",motif:"Fièvre, convulsions, troubles de la conscience.",hma:"Le début de la symptomatologie remonterait à 3 jours avant l'admission, marqué par une fièvre non chiffrée, intermittente, sans frissons, associée à une anorexie et à des vomissements alimentaires (3 à 4 épisodes par jour). Un traitement à domicile par paracétamol sirop a été entrepris sans amélioration. L'évolution a été marquée le jour de l'admission par la survenue de deux crises convulsives tonico-cloniques généralisées d'environ 5 minutes chacune, sans reprise complète de la conscience entre les crises, motivant une consultation au CSI qui l'a référée après administration de diazépam intrarectal.",grossesse:"Grossesse suivie (4 CPN), sans pathologie notable signalée ; TPI reçu.",accouchement:"À terme, en maternité, par voie basse ; cri immédiat ; pas de réanimation.",mens_naiss:"P 3000 g ; T et PC non retrouvés",atcd_med:"Épisodes fébriles traités au CSI ; pas d'hospitalisation antérieure ; pas d'intervention chirurgicale.",croissance:"Courbe du carnet non tenue après 12 mois.",puberte:"Non applicable",dpm:"Sourire à 2 mois, tenue de tête à 3 mois, assise à 7 mois, marche à 14 mois ; langage adapté à l'âge.",allaitement:"Allaitement maternel (AM) + eau/tisanes",alimentation:"Sevrage brutal à 18 mois (nouvelle grossesse maternelle) ; bouillie de mil peu enrichie puis plat familial ; 2 repas/jour.",vaccin:"Incomplet",vaccin_det:"BCG (cicatrice visible), Penta 1 et 2 ; VAR non reçu",fratrie:"3e d'une fratrie de 4 ; tous vivants, apparemment bien portants.",parents:"Parents vivants, apparemment bien portants ; pas de consanguinité ; drépanocytose non connue.",famille:"RAS",socio:"Niveau socio-économique bas ; mère non scolarisée ; famille de 9 personnes ; pas de moustiquaire imprégnée.",poids:"11",taille:"92",pc:"48",pb:"122",imc:"13.0",rapports:"P/T entre −2 et −3 Z ; T/A ≈ −1 Z ; PB 122 mm (malnutrition aiguë modérée).",fc:"152",fr:"48",ta:"90/50",temp:"39.6",spo2:"95",glyc:"0.62",conscience:"Obnubilée ; score de Blantyre 2/5 (ne suit pas du regard, gémit, retire le membre à la douleur) ; pas de crise à l'admission.",trophicite:"Malnutrition aiguë modérée",hydratation:"Pli cutané s'effaçant lentement, yeux légèrement enfoncés ; pas d'œdèmes.",general:"Pâleur cutanéo-muqueuse franche (paumes, conjonctives) ; pas d'ictère, pas de cyanose, pas d'éruption.",cardio:"Tachycardie régulière à 152/min ; souffle systolique 2/6 au foyer mitral d'allure fonctionnelle ; pas de galop ; TRC 2 s ; pouls perçus.",resp:"Polypnée à 48/min sans signe de lutte ; murmure vésiculaire bien perçu ; pas de râles.",abdo:"Abdomen souple ; splénomégalie type 2 de Hackett ; hépatomégalie à 2 cm du rebord costal, lisse, indolore.",uro:"Fosses lombaires libres ; OGE féminins normaux ; urines claires.",neuro:"Hypotonie globale ; ROT présents et symétriques ; Babinski indifférent ; pas de signe de localisation ; pas de raideur de nuque ; pupilles symétriques réactives.",membres:"Pas de déformation ni d'œdème ; pas de douleur osseuse.",rachis:"Sans particularité",ganglions:"Aires ganglionnaires libres",crane:"Crâne normal ; fontanelle fermée ; pas de dysmorphie ; conjonctives pâles.",orl:"Langue saburrale ; pharynx légèrement érythémateux ; tympans normaux.",resume:"Il s'agit d'une fillette de 3 ans et 1 mois, venant de Talladjé (Niamey), référée par le CSI et admise aux urgences pédiatriques pour fièvre, convulsions et troubles de la conscience, issue d'une grossesse suivie et d'un accouchement eutocique à terme, incomplètement vaccinée, recevant une alimentation insuffisante, chez qui l'anamnèse et l'examen clinique ont révélé : un syndrome infectieux (fièvre à 39,6 °C), un syndrome convulsif, un syndrome comateux (Blantyre 2/5), un syndrome anémique (pâleur, tachycardie, souffle fonctionnel), une splénomégalie et une malnutrition aiguë modérée.",h1:"Paludisme grave à forme neurologique et anémique",h2:"Méningite bactérienne",h3:"Méningo-encéphalite virale",d1p:`Épidémiologiques : enfant < 5 ans vivant en zone d'endémie, saison des pluies, absence de moustiquaire imprégnée.
Anamnestiques : fièvre, vomissements, convulsions répétées.
Cliniques : coma (Blantyre 2/5), pâleur, splénomégalie.
Paracliniques : TDR positif ; goutte épaisse à 85 000 trophozoïtes/µl de P. falciparum ; Hb 5,8 g/dl ; glycémie 0,62 g/l.`,d1c:"Aucun argument en défaveur.",d2p:"Fièvre, convulsions, troubles de la conscience chez un enfant incomplètement vacciné.",d2c:"Absence de raideur de nuque ; LCR clair : 3 éléments/mm³, protéinorachie 0,30 g/l, glycorachie normale ; Gram et culture négatifs.",d3p:"Fièvre et troubles de la conscience.",d3c:"Pas de signe de localisation ; LCR normal ; explication suffisante par le paludisme.",diag:"Paludisme grave à Plasmodium falciparum, forme neurologique et anémique, sur terrain de malnutrition aiguë modérée.",retentissement:"Hydro-électrolytique : déshydratation modérée (pli cutané, yeux enfoncés, vomissements). Glycémique : glycémie limite (0,62 g/l), à surveiller. Cardiovasculaire : anémie bien tolérée sur le plan hémodynamique (pas de signe de défaillance).",causes:"Plasmodium falciparum (TDR et goutte épaisse positifs).",porte:"Piqûre d'anophèle femelle infecté.",terrain:"Malnutrition aiguë modérée (P/T entre −2 et −3 Z ; PB 122 mm) ; vaccination incomplète.",but:"Éliminer le parasite, corriger l'anémie et les troubles hydro-électrolytiques, prévenir les complications et les récidives.",moyens:`Symptomatiques : paracétamol, diazépam, glucosé 10 %, oxygène, solutés.
Étiologiques : artésunate injectable, puis CTA.
Autres : transfusion de culot globulaire, prise en charge nutritionnelle.`,indications:"Artésunate IV 3 mg/kg (33 mg) à H0, H12, H24 puis toutes les 24 h jusqu'à reprise de la voie orale, relais par artéméther-luméfantrine pendant 3 jours. Paracétamol 15 mg/kg toutes les 6 h. Apports glucosés d'entretien. Réhydratation prudente par SRO (malnutrition).",pec_compl:"Convulsions : diazépam 0,5 mg/kg IR si nouvelle crise > 5 min. Anémie : transfusion de culot globulaire 10–15 ml/kg si Hb < 5 g/dl ou signes de mauvaise tolérance. Hypoglycémie : G10 % 5 ml/kg.",pec_cause:"Prise en charge de la malnutrition modérée (CRENAM), mise à jour du calendrier vaccinal, moustiquaire imprégnée, éducation nutritionnelle.",surveillance:"Conscience (Blantyre), convulsions, température, FC, FR, diurèse, glycémie toutes les 4–6 h ; Hb à 24 h ; goutte épaisse de contrôle à J3.",evolution:"Favorable : apyrexie à H48, reprise de la conscience à H24 (Blantyre 5/5), Hb 8,4 g/dl après transfusion ; sortie à J5.",pronostic:"Bon sous traitement ; risque de séquelles neurologiques à évaluer au suivi.",conclusion:"Ce cas souligne : la fréquence et la gravité du paludisme chez l'enfant de moins de 5 ans au Niger ; l'importance d'une prise en charge urgente (artésunate injectable) ; l'intérêt des mesures de prévention (MILDA, CPS, vaccin antipaludique, vaccinations du PEV) ; et le rôle aggravant de la malnutrition."},RX=(()=>{const e=`<defs><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter><filter id="bl2"><feGaussianBlur stdDeviation="2.5"/></filter>
